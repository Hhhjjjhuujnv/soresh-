<!DOCTYPE html>

<head>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #ffe6d9, #ffe7c9, #fff3d6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 15px;
            animation: float 3s ease-in-out infinite;

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: clamp(24px, 5vw, 32px);
            color: #ff8748;
            margin: 10px 0 5px;
        }

        p.subtitle {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #a5694f;
            margin-bottom: 25px;
        }

        .btn {
            width: 90%;
            max-width: 320px;
            padding: 15px;
            background: #fff7f3;
            border-radius: 14px;
            text-align: center;
            margin: 10px 0;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 600;
            color: #ff7033;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.25s;
        }

        .btn:hover {
            background: #ffe9df;
            transform: scale(1.05);
        }

        /* Cute Wave Decoration */
        .wave {
            width: 100%;
            margin-top: 50px;
        }

        footer {
            margin-top: -15px;
            font-size: clamp(14px, 3vw, 16px);
            color: #b97f61;
        }

    </style>
</head>
